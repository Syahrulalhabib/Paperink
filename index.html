<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logowithback.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Paperink — Supplier Merchandise Corporate. Solusi satu pintu dari konsep hingga pengemasan premium." />
    <title>Paperink Official | Supplier Merchandise Corporate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('paperink-theme-v3');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      /* Paperink Luxury Monochrome Preloader */
      .preloader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0A0A0A;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s ease;
      }
      html:not(.dark) .preloader {
        background: #FFFFFF;
      }
      .preloader--hidden {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
      .preloader__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 24px;
        user-select: none;
      }
      .preloader__logo-wrap {
        width: 140px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: preloaderPulse 1.8s ease-in-out infinite;
      }
      .preloader__logo {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: none;
      }
      html.dark .preloader__logo--dark {
        display: block;
      }
      html:not(.dark) .preloader__logo--light {
        display: block;
      }
      .preloader__track {
        width: 120px;
        height: 2px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
      }
      html:not(.dark) .preloader__track {
        background: rgba(0, 0, 0, 0.08);
      }
      .preloader__bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 48%;
        background: linear-gradient(90deg, transparent, #FFFFFF, transparent);
        border-radius: 99px;
        animation: preloaderScan 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      html:not(.dark) .preloader__bar {
        background: linear-gradient(90deg, transparent, #171717, transparent);
      }
      .preloader__text {
        font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #737373;
        opacity: 0.9;
      }
      @keyframes preloaderPulse {
        0%, 100% {
          transform: scale(0.97);
          opacity: 0.88;
        }
        50% {
          transform: scale(1.03);
          opacity: 1;
        }
      }
      @keyframes preloaderScan {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <!-- Brand Preloader -->
    <div id="paperink-preloader" class="preloader" aria-hidden="true">
      <div class="preloader__inner">
        <div class="preloader__logo-wrap">
          <img src="/images/logo-dark.svg" alt="Paperink" class="preloader__logo preloader__logo--dark" />
          <img src="/images/logo.svg" alt="Paperink" class="preloader__logo preloader__logo--light" />
        </div>
        <div class="preloader__track">
          <div class="preloader__bar"></div>
        </div>
        <div class="preloader__text">Supplier Merchandise Corporate</div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Fallback: Dismiss preloader safely if window load finishes
      window.addEventListener('load', function () {
        setTimeout(function () {
          var p = document.getElementById('paperink-preloader');
          if (p && !p.classList.contains('preloader--hidden')) {
            p.classList.add('preloader--hidden');
            setTimeout(function () { p.style.display = 'none'; }, 550);
          }
        }, 800);
      });
      setTimeout(function () {
        var p = document.getElementById('paperink-preloader');
        if (p && !p.classList.contains('preloader--hidden')) {
          p.classList.add('preloader--hidden');
          setTimeout(function () { p.style.display = 'none'; }, 550);
        }
      }, 3000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
